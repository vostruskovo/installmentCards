<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installment Tracker · 3/5/6x</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 1200px;
            width: 100%;
        }

        /* header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            gap: 1rem;
        }

        .header h1 {
            font-weight: 600;
            font-size: 2.1rem;
            color: #0b2b3d;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: #2a7faa;
            font-size: 2rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #1a5f7a;
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 18px rgba(26, 95, 122, 0.2);
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #0f4a61;
            transform: scale(1.02);
            box-shadow: 0 10px 22px rgba(26, 95, 122, 0.35);
        }

        .btn-primary i {
            font-size: 1.1rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #b0cbd9;
            color: #1a4b5e;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-outline:hover {
            background: #dbe8f0;
        }

        .btn-success-outline {
            background: transparent;
            border: 1px solid #2a8a5c;
            color: #1a6a4a;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-success-outline:hover {
            background: #d4f0e0;
        }

        .btn-danger-outline {
            background: transparent;
            border: 1px solid #b34a3a;
            color: #8a3a2a;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-danger-outline:hover {
            background: #fce8e4;
        }

        .toolbar-divider {
            width: 1px;
            height: 30px;
            background: #c0d4e0;
            margin: 0 4px;
        }

        .file-input-hidden {
            display: none;
        }

        .lang-selector {
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid #bdd3e0;
            border-radius: 30px;
            padding: 0.2rem 0.7rem;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1d4d63;
            cursor: pointer;
            transition: 0.1s;
        }

        .lang-btn.active {
            background: #1a5f7a;
            color: white;
            border-color: #1a5f7a;
        }

        .lang-btn:hover:not(.active) {
            background: #d4e3ed;
        }

        /* search bar */
        .search-container {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            background: white;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .search-container i {
            color: #6f8fa0;
            font-size: 1.1rem;
        }

        .search-container input {
            flex: 1;
            min-width: 200px;
            border: none;
            padding: 0.5rem 0;
            font-size: 1rem;
            background: transparent;
            outline: none;
            color: #1a4b5e;
        }

        .search-container input::placeholder {
            color: #a0bccd;
        }

        .total-display {
            font-weight: 600;
            color: #1a5f7a;
            font-size: 1.1rem;
            white-space: nowrap;
            padding-left: 1rem;
            border-left: 2px solid #e0eaf2;
        }

        .total-display span {
            color: #0f4a61;
            font-size: 1.2rem;
        }

        /* card grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        /* single card */
        .installment-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(6px);
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 18px 35px -8px rgba(0, 20, 30, 0.15);
            padding: 1.8rem 1.5rem 1.8rem 1.5rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            min-height: 280px;
            height: 100%;
        }

        .installment-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 28px 40px -12px rgba(0, 30, 40, 0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            padding-bottom: 0.7rem;
            flex-shrink: 0;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.4rem;
            color: #103544;
        }

        .card-title small {
            font-weight: 400;
            font-size: 0.9rem;
            color: #3d6a7e;
            margin-left: 8px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            color: #4f6f80;
            padding: 6px 8px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
        }

        .icon-btn:hover {
            background: #e3edf5;
            color: #154c63;
        }

        .icon-btn.danger:hover {
            background: #fce8e8;
            color: #b33c3c;
        }

        .price-display {
            font-size: 0.9rem;
            color: #1a5f7a;
            background: #e8f0f6;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .info-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: #1e4a5e;
            background: #eef4f9;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            margin-bottom: 1.4rem;
            font-weight: 500;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 6px;
        }

        .info-line span i {
            margin-right: 6px;
            color: #2d6a82;
        }

        /* timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 0.5rem 0 0.2rem;
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 4px;
        }

        .timeline::-webkit-scrollbar {
            width: 4px;
        }

        .timeline::-webkit-scrollbar-track {
            background: #eef4f9;
            border-radius: 10px;
        }

        .timeline::-webkit-scrollbar-thumb {
            background: #b0cbd9;
            border-radius: 10px;
        }

        .installment-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f7faff;
            padding: 0.6rem 1rem 0.6rem 1.2rem;
            border-radius: 60px;
            transition: 0.1s;
            border: 1px solid #e5eef5;
            flex-shrink: 0;
        }

        .installment-item.done {
            background: #e2f0e6;
            border-color: #b4d3be;
        }

        .installment-item.done .installment-label {
            text-decoration: line-through;
            color: #1f5a3a;
        }

        .installment-check {
            width: 22px;
            height: 22px;
            accent-color: #1b7a4b;
            cursor: pointer;
            flex-shrink: 0;
        }

        .installment-label {
            flex: 1;
            font-weight: 500;
            color: #183e4e;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .installment-label i {
            color: #4e7e94;
            font-size: 0.8rem;
        }

        .installment-price {
            font-size: 0.8rem;
            color: #1a5f7a;
            font-weight: 600;
            background: #e8f0f6;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #4b6e80;
            background: rgba(255,255,255,0.5);
            border-radius: 60px;
            backdrop-filter: blur(4px);
            font-size: 1.1rem;
        }

        .empty-state i {
            font-size: 2.8rem;
            opacity: 0.5;
            margin-bottom: 1rem;
        }

        /* modal / form */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 20, 30, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: white;
            max-width: 480px;
            width: 90%;
            border-radius: 48px;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 40px 60px -20px rgba(0,0,0,0.4);
            transform: scale(0.95);
            transition: 0.2s;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h2 {
            font-weight: 600;
            color: #0b3142;
            margin-bottom: 1.8rem;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            font-weight: 500;
            color: #1c4d62;
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #d4e1eb;
            border-radius: 60px;
            font-size: 1rem;
            background: #fafdff;
            transition: 0.15s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #1f7b9e;
            outline: none;
            box-shadow: 0 0 0 4px rgba(31, 123, 158, 0.15);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 2rem;
            justify-content: flex-end;
        }

        .btn-secondary {
            background: #e4edf5;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            color: #1d4d63;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #d0deea;
        }

        .btn-success {
            background: #1a7a5c;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-success:hover {
            background: #0f654b;
        }

        .text-muted {
            color: #5e7d8f;
            font-size: 0.85rem;
        }

        /* footer */
        .footer-note {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #3c687c;
            opacity: 0.7;
        }

        .card-hidden {
            display: none !important;
        }

        @media (max-width: 500px) {
            .header h1 { font-size: 1.6rem; }
            .installment-item { flex-wrap: wrap; }
            .header-actions .btn-outline,
            .header-actions .btn-success-outline,
            .header-actions .btn-danger-outline {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }
            .installment-card {
                min-height: 200px;
            }
            .timeline {
                max-height: 250px;
            }
            .search-container {
                flex-direction: column;
                align-items: stretch;
                padding: 1rem;
                border-radius: 24px;
            }
            .search-container input {
                min-width: unset;
            }
            .total-display {
                border-left: none;
                padding-left: 0;
                padding-top: 0.5rem;
                border-top: 2px solid #e0eaf2;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-credit-card"></i> <span id="appTitle">Installment cards</span></h1>
        <div class="header-actions">
            <div class="lang-selector">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="pt">PT</button>
                <button class="lang-btn" data-lang="es">ES</button>
            </div>
            <button class="btn-success-outline" id="exportBtn"><i class="fas fa-download"></i> <span id="exportLabel">Export</span></button>
            <button class="btn-outline" id="importBtn"><i class="fas fa-upload"></i> <span id="importLabel">Import</span></button>
            <input type="file" id="fileInput" class="file-input-hidden" accept=".json" />
            <div class="toolbar-divider"></div>
            <button class="btn-danger-outline" id="clearAllBtn"><i class="fas fa-trash"></i> <span id="clearLabel">Clear all</span></button>
            <button class="btn-primary" id="openCreateBtn"><i class="fas fa-plus-circle"></i> <span id="newCardLabel">New card</span></button>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search bills..." />
        <div class="total-display">
            <i class="fas fa-dollar-sign"></i> Total: <span id="totalAmount">$0.00</span>
        </div>
    </div>

    <!-- card grid -->
    <div id="cardGrid" class="card-grid"></div>

    <!-- empty state -->
    <div id="emptyState" class="empty-state" style="display: none;">
        <div><i class="fas fa-layer-group"></i></div>
        <p id="emptyMsg">No installment cards yet.<br>Click "New card" to start tracking.</p>
    </div>

    <!-- modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2 id="modalTitle"><i class="fas fa-pen"></i> New card</h2>
            <form id="cardForm">
                <div class="form-group">
                    <label for="cardName" id="cardNameLabel">Card name / description</label>
                    <input type="text" id="cardName" placeholder="e.g. Laptop 12" required>
                </div>
                <div class="form-group">
                    <label for="installmentPlan" id="installmentPlanLabel">Installments</label>
                    <select id="installmentPlan">
                        <option value="1">1x</option>
                        <option value="2">2x</option>
                        <option value="3" selected>3x</option>
                        <option value="4">4x</option>
                        <option value="5">5x</option>
                        <option value="6">6x</option>
                        <option value="7">7x</option>
                        <option value="8">8x</option>
                        <option value="9">9x</option>
                        <option value="10">10x</option>
                        <option value="12">12x</option>
                        <option value="15">15x</option>
                        <option value="18">18x</option>
                        <option value="20">20x</option>
                        <option value="24">24x</option>
                        <option value="30">30x</option>
                        <option value="36">36x</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="installmentPrice" id="priceLabel">Installment price</label>
                    <input type="number" id="installmentPrice" placeholder="0.00" step="0.01" min="0" value="0.00">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="closeModalBtn"><span id="cancelLabel">Cancel</span></button>
                    <button type="submit" class="btn-success" id="submitBtn"><i class="fas fa-check"></i> <span id="saveLabel">Save</span></button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer-note">
        <i class="fas fa-database"></i> <span id="footerText">permanent storage · all changes saved automatically</span>
    </div>
</div>
<script>
    (function(){
        // ----- I18n & Language -----
        const translations = {
            en: {
                appTitle: 'Installment cards',
                newCard: 'New card',
                export: 'Export',
                import: 'Import',
                clearAll: 'Clear all',
                emptyMsg: 'No installment cards yet.<br>Click "New card" to start tracking.',
                footer: 'permanent storage · all changes saved automatically',
                cardNameLabel: 'Card name / description',
                installmentPlanLabel: 'Installments',
                priceLabel: 'Installment price',
                cancel: 'Cancel',
                save: 'Save',
                editCard: 'Edit card',
                update: 'Update',
                create: 'Create',
                paid: 'paid',
                installment: 'Installment',
                deleteConfirm: 'Delete this card and all installments?',
                clearAllConfirm: 'Delete ALL cards? This action cannot be undone!',
                exportError: 'No data to export.',
                importSuccess: 'Data imported successfully!',
                importError: 'Invalid file format. Please import a valid JSON file.',
                dateLocale: 'en-US',
                searchPlaceholder: 'Search bills...',
                total: 'Total'
            },
            pt: {
                appTitle: 'Cartões de parcelas',
                newCard: 'Novo cartão',
                export: 'Exportar',
                import: 'Importar',
                clearAll: 'Limpar tudo',
                emptyMsg: 'Nenhum cartão de parcelas ainda.<br>Clique em "Novo cartão" para começar.',
                footer: 'armazenamento permanente · todas as alterações salvas automaticamente',
                cardNameLabel: 'Nome / descrição',
                installmentPlanLabel: 'Parcelas',
                priceLabel: 'Valor da parcela',
                cancel: 'Cancelar',
                save: 'Salvar',
                editCard: 'Editar cartão',
                update: 'Atualizar',
                create: 'Criar',
                paid: 'pago',
                installment: 'Parcela',
                deleteConfirm: 'Excluir este cartão e todas as parcelas?',
                clearAllConfirm: 'Excluir TODOS os cartões? Esta ação não pode ser desfeita!',
                exportError: 'Nenhum dado para exportar.',
                importSuccess: 'Dados importados com sucesso!',
                importError: 'Formato de arquivo inválido. Importe um arquivo JSON válido.',
                dateLocale: 'pt-BR',
                searchPlaceholder: 'Buscar contas...',
                total: 'Total'
            },
            es: {
                appTitle: 'Tarjetas de cuotas',
                newCard: 'Nueva tarjeta',
                export: 'Exportar',
                import: 'Importar',
                clearAll: 'Limpiar todo',
                emptyMsg: 'No hay tarjetas de cuotas aún.<br>Haz clic en "Nueva tarjeta" para empezar.',
                footer: 'almacenamiento permanente · todos los cambios se guardan automáticamente',
                cardNameLabel: 'Nombre / descripción',
                installmentPlanLabel: 'Cuotas',
                priceLabel: 'Precio de la cuota',
                cancel: 'Cancelar',
                save: 'Guardar',
                editCard: 'Editar tarjeta',
                update: 'Actualizar',
                create: 'Crear',
                paid: 'pagado',
                installment: 'Cuota',
                deleteConfirm: '¿Eliminar esta tarjeta y todas las cuotas?',
                clearAllConfirm: '¿Eliminar TODAS las tarjetas? ¡Esta acción no se puede deshacer!',
                exportError: 'No hay datos para exportar.',
                importSuccess: '¡Datos importados correctamente!',
                importError: 'Formato de archivo inválido. Importa un archivo JSON válido.',
                dateLocale: 'es-ES',
                searchPlaceholder: 'Buscar facturas...',
                total: 'Total'
            }
        };

        let currentLang = 'en';

        function t(key) {
            return translations[currentLang]?.[key] || key;
        }

        function getDateLocale() {
            return translations[currentLang]?.dateLocale || 'en-US';
        }

        function updateUI() {
            const elements = {
                'appTitle': 'appTitle',
                'newCardLabel': 'newCard',
                'exportLabel': 'export',
                'importLabel': 'import',
                'clearLabel': 'clearAll',
                'emptyMsg': 'emptyMsg',
                'footerText': 'footer',
                'cardNameLabel': 'cardNameLabel',
                'installmentPlanLabel': 'installmentPlanLabel',
                'priceLabel': 'priceLabel',
                'cancelLabel': 'cancel',
                'saveLabel': 'save',
                'searchInput': 'searchPlaceholder'
            };
            
            for (const [id, key] of Object.entries(elements)) {
                const el = document.getElementById(id);
                if (el) {
                    if (id === 'searchInput') {
                        el.placeholder = t(key);
                    } else {
                        el.textContent = t(key);
                    }
                }
            }
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });

            // Update total label
            const totalLabel = document.querySelector('.total-display i');
            if (totalLabel) {
                // Keep it as is
            }
        }

        // Language switcher
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentLang = this.dataset.lang;
                updateUI();
                render();
            });
        });

        // ----- data management -----
        let cards = [];
        let editingId = null;

        const STORAGE_KEY = 'installment_cards_data';

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    cards = JSON.parse(stored);
                    cards = cards.filter(c => c && typeof c === 'object')
                                 .map(c => {
                                     if (!Array.isArray(c.done)) c.done = [];
                                     while (c.done.length < c.installments) c.done.push(false);
                                     while (c.done.length > c.installments) c.done.pop();
                                     return c;
                                 });
                } catch(e) { cards = []; }
            } else {
                const today = new Date().toISOString().split('T')[0];
                cards = [
                    { id: 'c1', name: 'MacBook Air', purchaseDate: today, installments: 3, price: 99.99, done: [true, false, false] },
                    { id: 'c2', name: 'Samsung S24', purchaseDate: today, installments: 5, price: 49.99, done: [false, false, false, false, false] },
                    { id: 'c3', name: 'Sony Headphones', purchaseDate: today, installments: 2, price: 29.99, done: [true, true] },
                ];
                saveData();
            }
            render();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
        }

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

        function addCard(card) {
            cards.push(card);
            saveData();
            render();
        }

        function updateCard(id, updated) {
            const index = cards.findIndex(c => c.id === id);
            if (index !== -1) {
                cards[index] = { ...cards[index], ...updated };
                saveData();
                render();
            }
        }

        function deleteCard(id) {
            if (confirm(t('deleteConfirm'))) {
                cards = cards.filter(c => c.id !== id);
                saveData();
                render();
            }
        }

        function toggleInstallment(cardId, index) {
            const card = cards.find(c => c.id === cardId);
            if (!card) return;
            if (index >= 0 && index < card.done.length) {
                card.done[index] = !card.done[index];
                saveData();
                render();
            }
        }

        // ----- Search -----
        function filterCards(searchTerm) {
            const searchLower = searchTerm.toLowerCase().trim();
            const cardElements = document.querySelectorAll('.installment-card');
            let visibleCount = 0;
            
            cardElements.forEach(el => {
                const name = el.dataset.cardName || '';
                const matches = name.toLowerCase().includes(searchLower);
                if (matches || searchTerm === '') {
                    el.classList.remove('card-hidden');
                    visibleCount++;
                } else {
                    el.classList.add('card-hidden');
                }
            });

            // Update total
            updateTotal();
        }

        function updateTotal() {
            const visibleCards = document.querySelectorAll('.installment-card:not(.card-hidden)');
            let total = 0;
            
            visibleCards.forEach(el => {
                const price = parseFloat(el.dataset.cardPrice) || 0;
                const installments = parseInt(el.dataset.cardInstallments) || 0;
                total += price * installments;
            });
            
            const locale = getDateLocale();
            const formatter = new Intl.NumberFormat(locale, {
                style: 'currency',
                currency: 'USD'
            });
            
            document.getElementById('totalAmount').textContent = formatter.format(total);
        }

        // ----- Export / Import -----
        function exportData() {
            if (cards.length === 0) {
                alert(t('exportError'));
                return;
            }
            const data = {
                version: '1.0',
                exportedAt: new Date().toISOString(),
                cards: cards
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `installment_cards_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.cards || !Array.isArray(data.cards)) {
                        alert(t('importError'));
                        return;
                    }
                    const importedCards = data.cards.filter(c => c && typeof c === 'object' && c.name && c.installments !== undefined);
                    if (importedCards.length === 0) {
                        alert(t('importError'));
                        return;
                    }
                    const sanitized = importedCards.map(c => ({
                        id: c.id || generateId(),
                        name: c.name,
                        purchaseDate: c.purchaseDate || new Date().toISOString().split('T')[0],
                        installments: parseInt(c.installments, 10) || 3,
                        price: parseFloat(c.price) || 0,
                        done: Array.isArray(c.done) ? c.done : new Array(parseInt(c.installments, 10) || 3).fill(false)
                    }));
                    sanitized.forEach(c => {
                        while (c.done.length < c.installments) c.done.push(false);
                        while (c.done.length > c.installments) c.done.pop();
                    });
                    
                    cards = sanitized;
                    saveData();
                    alert(t('importSuccess'));
                    render();
                } catch(err) {
                    alert(t('importError'));
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (confirm(t('clearAllConfirm'))) {
                cards = [];
                saveData();
                render();
            }
        }

        // ----- render -----
        function renderCard(card) {
            const { id, name, installments, price, done } = card;

            const cardDiv = document.createElement('div');
            cardDiv.className = 'installment-card';
            cardDiv.dataset.cardName = name.toLowerCase();
            cardDiv.dataset.cardPrice = price || 0;
            cardDiv.dataset.cardInstallments = installments;

            const header = document.createElement('div');
            header.className = 'card-header';
            
            const priceDisplay = price ? `<span class="price-display"><i class="fas fa-dollar-sign"></i> ${price.toFixed(2)}</span>` : '';
            
            header.innerHTML = `
                <div class="card-title">${name} <small>${installments}x</small></div>
                <div class="card-actions">
                    ${priceDisplay}
                    <button class="icon-btn edit-btn" data-id="${id}" title="Edit"><i class="fas fa-edit"></i></button>
                    <button class="icon-btn danger delete-btn" data-id="${id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
            cardDiv.appendChild(header);

            const paidCount = done.filter(Boolean).length;
            const total = installments;
            const totalPrice = (price || 0) * installments;
            const locale = getDateLocale();
            const formatter = new Intl.NumberFormat(locale, {
                style: 'currency',
                currency: 'USD'
            });
            
            const info = document.createElement('div');
            info.className = 'info-line';
            info.innerHTML = `
                <span><i class="fas fa-calendar-check"></i> ${paidCount}/${total} ${t('paid')}</span>
                <span><i class="fas fa-dollar-sign"></i> ${formatter.format(totalPrice)}</span>
            `;
            cardDiv.appendChild(info);

            const timeline = document.createElement('div');
            timeline.className = 'timeline';

            for (let i = 0; i < installments; i++) {
                const isDone = done[i] || false;

                const item = document.createElement('div');
                item.className = `installment-item ${isDone ? 'done' : ''}`;

                const check = document.createElement('input');
                check.type = 'checkbox';
                check.className = 'installment-check';
                check.checked = isDone;
                check.dataset.cardId = id;
                check.dataset.index = i;
                check.addEventListener('change', function(e) {
                    e.stopPropagation();
                    const cId = this.dataset.cardId;
                    const idx = parseInt(this.dataset.index, 10);
                    toggleInstallment(cId, idx);
                });

                const label = document.createElement('span');
                label.className = 'installment-label';
                label.innerHTML = `<i class="fas fa-circle" style="font-size: 0.5rem; color: ${isDone ? '#1b7a4b' : '#7e9aad'}"></i> ${t('installment')} ${i+1}`;

                if (price) {
                    const priceSpan = document.createElement('span');
                    priceSpan.className = 'installment-price';
                    priceSpan.textContent = formatter.format(price);
                    item.appendChild(check);
                    item.appendChild(label);
                    item.appendChild(priceSpan);
                } else {
                    item.appendChild(check);
                    item.appendChild(label);
                }
                timeline.appendChild(item);
            }

            cardDiv.appendChild(timeline);
            return cardDiv;
        }

        function render() {
            const grid = document.getElementById('cardGrid');
            const empty = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (!cards || cards.length === 0) {
                empty.style.display = 'block';
                document.getElementById('totalAmount').textContent = '$0.00';
                return;
            }
            empty.style.display = 'none';

            // Sort alphabetically by name
            const sorted = [...cards].sort((a, b) => a.name.localeCompare(b.name));
            sorted.forEach(card => {
                const el = renderCard(card);
                grid.appendChild(el);
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    openEditModal(id);
                };
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    deleteCard(id);
                };
            });

            // Apply search filter
            const searchInput = document.getElementById('searchInput');
            if (searchInput.value) {
                filterCards(searchInput.value);
            } else {
                updateTotal();
            }
        }

        // ----- modal logic -----
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const cardForm = document.getElementById('cardForm');
        const cardName = document.getElementById('cardName');
        const installmentPlan = document.getElementById('installmentPlan');
        const installmentPrice = document.getElementById('installmentPrice');
        const submitBtn = document.getElementById('submitBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function openModal(editData = null) {
            modalOverlay.classList.add('active');
            if (editData) {
                modalTitle.innerHTML = `<i class="fas fa-edit"></i> ${t('editCard')}`;
                cardName.value = editData.name || '';
                installmentPlan.value = String(editData.installments || 3);
                installmentPrice.value = editData.price ? editData.price.toFixed(2) : '0.00';
                submitBtn.innerHTML = `<i class="fas fa-check"></i> ${t('update')}`;
                editingId = editData.id;
            } else {
                modalTitle.innerHTML = `<i class="fas fa-plus-circle"></i> ${t('newCard')}`;
                cardName.value = '';
                installmentPlan.value = '3';
                installmentPrice.value = '0.00';
                submitBtn.innerHTML = `<i class="fas fa-check"></i> ${t('create')}`;
                editingId = null;
            }
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            editingId = null;
        }

        document.getElementById('openCreateBtn').addEventListener('click', function() {
            openModal(null);
        });

        function openEditModal(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;
            openModal({ id: card.id, name: card.name, installments: card.installments, price: card.price });
        }

        cardForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = cardName.value.trim();
            if (!name) { alert('Please enter a name.'); return; }
            const installments = parseInt(installmentPlan.value, 10);
            const price = parseFloat(installmentPrice.value) || 0;

            if (editingId) {
                const existing = cards.find(c => c.id === editingId);
                if (existing) {
                    let newDone = [...existing.done];
                    if (installments !== existing.installments) {
                        if (installments > existing.installments) {
                            while (newDone.length < installments) newDone.push(false);
                        } else {
                            newDone = newDone.slice(0, installments);
                        }
                    }
                    updateCard(editingId, {
                        name, installments, price, done: newDone
                    });
                }
            } else {
                const today = new Date().toISOString().split('T')[0];
                const newCard = {
                    id: generateId(),
                    name,
                    purchaseDate: today,
                    installments,
                    price: price,
                    done: new Array(installments).fill(false),
                };
                addCard(newCard);
            }
            closeModal();
            cardForm.reset();
        });

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });

        // ----- Search event -----
        document.getElementById('searchInput').addEventListener('input', function(e) {
            filterCards(this.value);
        });

        // ----- Export / Import event listeners -----
        document.getElementById('exportBtn').addEventListener('click', exportData);
        
        document.getElementById('importBtn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                importData(this.files[0]);
                this.value = '';
            }
        });

        document.getElementById('clearAllBtn').addEventListener('click', clearAllData);

        // ----- Init -----
        loadData();
        updateUI();

        window.__cards = cards;
    })();
</script>
</body>
</html>

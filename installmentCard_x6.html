<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installment Tracker · Cards & Bills</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f5fa 0%, #e4ecf3 100%);
            min-height: 100vh;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 1400px;
            width: 100%;
        }

        /* header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 0.8rem;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.5rem;
            color: #0b2b3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            color: #2a7faa;
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #1a5f7a;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(26, 95, 122, 0.25);
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #0f4a61;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #c5d8e5;
            color: #1a4b5e;
            padding: 0.4rem 1rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-outline:hover {
            background: #dbe8f0;
        }

        .btn-success-outline {
            background: transparent;
            border: 1px solid #2a8a5c;
            color: #1a6a4a;
            padding: 0.4rem 1rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-success-outline:hover {
            background: #d4f0e0;
        }

        .btn-danger-outline {
            background: transparent;
            border: 1px solid #b34a3a;
            color: #8a3a2a;
            padding: 0.4rem 1rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-danger-outline:hover {
            background: #fce8e4;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: #d4e1eb;
        }

        .file-input-hidden {
            display: none;
        }

        .lang-selector {
            display: flex;
            gap: 3px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid #c5d8e5;
            border-radius: 30px;
            padding: 0.15rem 0.6rem;
            font-weight: 600;
            font-size: 0.65rem;
            color: #1d4d63;
            cursor: pointer;
            transition: 0.1s;
        }

        .lang-btn.active {
            background: #1a5f7a;
            color: white;
            border-color: #1a5f7a;
        }

        .lang-btn:hover:not(.active) {
            background: #d4e3ed;
        }

        /* Dashboard Controls */
        .dashboard-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            background: white;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        .dashboard-controls i {
            color: #8aabbe;
            font-size: 0.95rem;
        }

        .dashboard-controls input {
            flex: 1;
            min-width: 150px;
            border: none;
            padding: 0.4rem 0;
            font-size: 0.9rem;
            background: transparent;
            outline: none;
            color: #1a4b5e;
        }

        .dashboard-controls input::placeholder {
            color: #b0cbd9;
        }

        .dashboard-controls select {
            border: none;
            background: #eef4f9;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #1a4b5e;
            outline: none;
            cursor: pointer;
            font-weight: 500;
        }

        .dashboard-controls select:hover {
            background: #dce8f0;
        }

        .dashboard-stats {
            font-size: 0.8rem;
            color: #5a7a8f;
            padding-left: 0.8rem;
            border-left: 2px solid #e0eaf2;
        }

        /* Dashboard - Card Grid */
        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        #dashboard.hidden {
            display: none;
        }

        /* Card Item */
        .card-item {
            background: white;
            border-radius: 20px;
            padding: 1.2rem 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            text-align: center;
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-color: #1a5f7a;
        }

        .card-item.active {
            border-color: #1a5f7a;
            background: #f0f7fa;
            box-shadow: 0 8px 25px rgba(26, 95, 122, 0.15);
        }

        .card-item.hidden-card {
            display: none;
        }

        .card-item-image {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e0eaf2;
            background: #eef4f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #4f7a8f;
            margin-bottom: 8px;
        }

        .card-item-image img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .card-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #103544;
            margin-bottom: 2px;
        }

        .card-item-desc {
            font-size: 0.75rem;
            color: #7a9aaf;
            margin-bottom: 6px;
        }

        .card-item-badge {
            font-size: 0.7rem;
            background: #eef4f9;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            color: #4f7a8f;
        }

        .card-item-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 2px;
        }

        .card-item-actions button {
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 30px;
            padding: 2px 6px;
            font-size: 0.7rem;
            color: #6a8aa0;
            cursor: pointer;
            transition: 0.15s;
        }

        .card-item-actions button:hover {
            background: #e3edf5;
            color: #154c63;
        }

        .card-item-actions button.danger:hover {
            background: #fce8e8;
            color: #b33c3c;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem;
            color: #7a9aaf;
            background: rgba(255,255,255,0.6);
            border-radius: 30px;
        }

        .no-results i {
            font-size: 2rem;
            opacity: 0.4;
            margin-bottom: 0.5rem;
        }

        /* Card Detail View - FULL PAGE */
        .card-detail {
            background: white;
            border-radius: 28px;
            padding: 1.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            display: none;
            margin-bottom: 1.5rem;
            min-height: 500px;
        }

        .card-detail.visible {
            display: block;
        }

        .card-detail-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: #1a4b5e;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            transition: 0.2s;
            margin-bottom: 0.8rem;
        }

        .card-detail-back:hover {
            background: #eef4f9;
        }

        .card-detail-back i {
            font-size: 0.9rem;
        }

        .card-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid #f0f5fa;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .card-detail-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-detail-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e0eaf2;
            background: #eef4f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #4f7a8f;
        }

        .card-detail-image img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .card-detail-info h2 {
            font-size: 1.6rem;
            color: #103544;
        }

        .card-detail-info .desc {
            font-size: 0.9rem;
            color: #7a9aaf;
        }

        .card-detail-info .summary {
            font-size: 0.85rem;
            color: #4f7a8f;
            margin-top: 4px;
        }

        .card-detail-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-sm {
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .btn-sm-success {
            background: #1a7a5c;
            color: white;
        }
        .btn-sm-success:hover { background: #0f654b; }

        .btn-sm-primary {
            background: #1a5f7a;
            color: white;
        }
        .btn-sm-primary:hover { background: #0f4a61; }

        .btn-sm-danger {
            background: #b34a3a;
            color: white;
        }
        .btn-sm-danger:hover { background: #8a3a2a; }

        .btn-sm-outline {
            background: transparent;
            border: 1px solid #c5d8e5;
            color: #1a4b5e;
        }
        .btn-sm-outline:hover { background: #dbe8f0; }

        /* Bill grid inside detail */
        .bill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
            margin-top: 0.5rem;
        }

        /* bill card */
        .bill-card {
            background: #f8fbfd;
            border-radius: 20px;
            padding: 1.2rem;
            border: 1px solid #e8eef5;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .bill-card:hover {
            border-color: #c5d8e5;
            background: #fafdff;
        }

        .bill-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
            gap: 4px;
        }

        .bill-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: #103544;
        }

        .bill-title small {
            font-weight: 400;
            font-size: 0.75rem;
            color: #6a8aa0;
            margin-left: 4px;
        }

        .bill-desc {
            font-size: 0.8rem;
            color: #7a9aaf;
            margin-top: -2px;
            margin-bottom: 4px;
        }

        .bill-actions {
            display: flex;
            gap: 2px;
        }

        .icon-btn-sm {
            background: transparent;
            border: none;
            font-size: 0.8rem;
            color: #6a8aa0;
            padding: 4px 6px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
        }

        .icon-btn-sm:hover {
            background: #e3edf5;
            color: #154c63;
        }

        .icon-btn-sm.danger:hover {
            background: #fce8e8;
            color: #b33c3c;
        }

        .bill-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #1e4a5e;
            background: #eef4f9;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            margin-bottom: 0.8rem;
            font-weight: 500;
            flex-wrap: wrap;
            gap: 4px;
        }

        .bill-info span i {
            margin-right: 4px;
            color: #5a8aa0;
            font-size: 0.75rem;
        }

        .bill-info .paid-amount {
            color: #1a7a5c;
        }

        .bill-info .remaining-amount {
            color: #b34a3a;
        }

        .bill-info .remaining-amount.zero {
            color: #1a7a5c;
        }

        .bill-timeline {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 3px;
        }

        .bill-timeline::-webkit-scrollbar {
            width: 3px;
        }

        .bill-timeline::-webkit-scrollbar-track {
            background: #eef4f9;
            border-radius: 10px;
        }

        .bill-timeline::-webkit-scrollbar-thumb {
            background: #c5d8e5;
            border-radius: 10px;
        }

        .bill-installment {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 0.3rem 0.6rem 0.3rem 0.8rem;
            border-radius: 40px;
            border: 1px solid #e8eef5;
            transition: 0.1s;
            flex-shrink: 0;
        }

        .bill-installment.done {
            background: #e8f5ec;
            border-color: #b4d3be;
        }

        .bill-installment.done .installment-label {
            text-decoration: line-through;
            color: #3a7a5a;
        }

        .bill-installment.past-due {
            background: #fde8e5;
            border-color: #f5c2bc;
        }

        .bill-installment input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #1b7a4b;
            cursor: pointer;
            flex-shrink: 0;
        }

        .installment-label {
            flex: 1;
            font-weight: 500;
            color: #2a4a5e;
            font-size: 0.8rem;
        }

        .installment-label i {
            color: #6a8aa0;
            font-size: 0.6rem;
            margin-right: 3px;
        }

        .installment-date {
            font-size: 0.65rem;
            color: #5a7a8f;
            background: #e8f0f6;
            padding: 0.1rem 0.4rem;
            border-radius: 30px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .badge-pastdue-sm {
            background: #c74b3c;
            color: white;
            font-size: 0.5rem;
            padding: 0.05rem 0.4rem;
            border-radius: 30px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        .badge-due-sm {
            background: #e8a03a;
            color: white;
            font-size: 0.5rem;
            padding: 0.05rem 0.4rem;
            border-radius: 30px;
            font-weight: 600;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .installment-price-sm {
            font-size: 0.7rem;
            color: #1a5f7a;
            font-weight: 600;
            background: #e8f0f6;
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
            white-space: nowrap;
        }

        .empty-bills {
            text-align: center;
            padding: 2rem;
            color: #8aabbe;
            background: #f8fbfd;
            border-radius: 20px;
            border: 2px dashed #dce6ef;
        }

        .empty-bills i {
            font-size: 2.5rem;
            opacity: 0.4;
            margin-bottom: 0.5rem;
        }

        .empty-bills p {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        /* empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #5a7a8f;
            background: rgba(255,255,255,0.6);
            border-radius: 40px;
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.4;
            margin-bottom: 1rem;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        /* modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 20, 30, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: white;
            max-width: 480px;
            width: 92%;
            border-radius: 40px;
            padding: 1.8rem;
            box-shadow: 0 40px 60px -20px rgba(0,0,0,0.4);
            transform: scale(0.95);
            transition: 0.2s;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h2 {
            font-weight: 600;
            color: #0b3142;
            margin-bottom: 1.4rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            font-weight: 500;
            color: #1c4d62;
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #d4e1eb;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #fafdff;
            transition: 0.15s;
        }

        .form-group textarea {
            border-radius: 16px;
            resize: vertical;
            min-height: 50px;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #1f7b9e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(31, 123, 158, 0.12);
        }

        .form-group input[type="file"] {
            padding: 0.4rem;
        }

        .image-preview {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4e1eb;
            margin-top: 6px;
            background: #eef4f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #4f7a8f;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
            justify-content: flex-end;
        }

        .btn-secondary {
            background: #e4edf5;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            font-weight: 500;
            color: #1d4d63;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background: #d0deea;
        }

        .btn-success {
            background: #1a7a5c;
            color: white;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-success:hover {
            background: #0f654b;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #5a7a8f;
            opacity: 0.6;
            text-align: center;
        }

        /* Hide dashboard controls when in detail view */
        .detail-mode .dashboard-controls {
            display: none;
        }

        .detail-mode #dashboard {
            display: none;
        }

        .detail-mode .card-detail {
            display: block !important;
        }

        /* Keyboard focus styles */
        input:focus, select:focus, textarea:focus, button:focus {
            outline: none;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .header { flex-direction: column; align-items: stretch; border-radius: 30px; padding: 0.8rem 1rem; }
            .header h1 { font-size: 1.2rem; }
            .header-actions { justify-content: center; }
            .dashboard-controls { flex-direction: column; align-items: stretch; border-radius: 24px; padding: 0.8rem 1rem; }
            .dashboard-controls input { min-width: unset; }
            .dashboard-controls select { width: 100%; }
            .dashboard-stats { border-left: none; padding-left: 0; padding-top: 0.5rem; border-top: 2px solid #e0eaf2; text-align: center; }
            #dashboard { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; }
            .card-item { min-height: 110px; padding: 0.8rem; }
            .card-item-image { width: 44px; height: 44px; font-size: 1.2rem; }
            .card-detail { padding: 1rem; }
            .card-detail-header { flex-direction: column; align-items: stretch; }
            .card-detail-image { width: 50px; height: 50px; font-size: 1.3rem; }
            .card-detail-info h2 { font-size: 1.3rem; }
            .bill-grid { grid-template-columns: 1fr; }
            .modal-box { padding: 1.2rem; }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .bill-grid { grid-template-columns: repeat(2, 1fr); }
            #dashboard { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
        }
    </style>
</head>
<body>
<div class="app-container" id="appContainer">
    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-credit-card"></i> <span id="appTitle">Cards & Bills</span></h1>
        <div class="header-actions">
            <div class="lang-selector">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="pt">PT</button>
                <button class="lang-btn" data-lang="es">ES</button>
            </div>
            <div class="toolbar-divider"></div>
            <button class="btn-success-outline" id="exportBtn"><i class="fas fa-download"></i> <span id="exportLabel">Export</span></button>
            <button class="btn-outline" id="importBtn"><i class="fas fa-upload"></i> <span id="importLabel">Import</span></button>
            <input type="file" id="fileInput" class="file-input-hidden" accept=".json" />
            <div class="toolbar-divider"></div>
            <button class="btn-danger-outline" id="clearAllBtn"><i class="fas fa-trash"></i> <span id="clearLabel">Clear all</span></button>
            <button class="btn-primary" id="openCreateCardBtn"><i class="fas fa-plus-circle"></i> <span id="newCardLabel">New card</span></button>
        </div>
    </div>

    <!-- Dashboard Controls -->
    <div id="dashboardControls" class="dashboard-controls">
        <i class="fas fa-search"></i>
        <input type="text" id="searchCardsInput" placeholder="Search cards..." />
        <select id="sortCardsSelect">
            <option value="alpha">Sort: A-Z</option>
            <option value="alphaDesc">Sort: Z-A</option>
        </select>
        <div class="dashboard-stats" id="cardsStats">0 cards</div>
    </div>

    <!-- Dashboard - Card Grid -->
    <div id="dashboard" class="dashboard"></div>

    <!-- Card Detail View - FULL PAGE -->
    <div id="cardDetail" class="card-detail"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display: none;">
        <i class="fas fa-credit-card"></i>
        <p id="emptyMsg">No cards yet.<br>Create your first card to start adding bills.</p>
        <button class="btn-primary" id="emptyCreateBtn" style="margin-top: 1rem;"><i class="fas fa-plus-circle"></i> New card</button>
    </div>

    <!-- Modal: Card -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-box">
            <h2 id="cardModalTitle"><i class="fas fa-pen"></i> New card</h2>
            <form id="cardForm">
                <div class="form-group">
                    <label for="cardNameInput" id="cardNameLabel">Card name</label>
                    <input type="text" id="cardNameInput" placeholder="e.g. Credit Card" required>
                </div>
                <div class="form-group">
                    <label for="cardDescInput" id="cardDescLabel">Description</label>
                    <textarea id="cardDescInput" placeholder="e.g. Main credit card for purchases" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="cardImageInput" id="cardImageLabel">Card image</label>
                    <input type="file" id="cardImageInput" accept="image/*">
                    <div id="cardImagePreviewContainer" style="margin-top: 6px;">
                        <div class="image-preview" id="cardImagePreview">
                            <i class="fas fa-image"></i>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="closeCardModalBtn"><span id="cancelLabel">Cancel</span></button>
                    <button type="submit" class="btn-success" id="cardSubmitBtn"><i class="fas fa-check"></i> <span id="saveLabel">Save</span></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Bill -->
    <div class="modal-overlay" id="billModal">
        <div class="modal-box">
            <h2 id="billModalTitle"><i class="fas fa-receipt"></i> New bill</h2>
            <form id="billForm">
                <div class="form-group">
                    <label for="billNameInput" id="billNameLabel">Bill name</label>
                    <input type="text" id="billNameInput" placeholder="e.g. MacBook Pro" required>
                </div>
                <div class="form-group">
                    <label for="billDescInput" id="billDescLabel">Description</label>
                    <textarea id="billDescInput" placeholder="e.g. M3 chip, 16GB RAM" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="billPurchaseDate" id="billDateLabel">Purchase date</label>
                    <input type="date" id="billPurchaseDate" required>
                </div>
                <div class="form-group">
                    <label for="billInstallments" id="billInstallmentsLabel">Number of installments</label>
                    <input type="number" id="billInstallments" min="1" max="999" value="3" required>
                </div>
                <div class="form-group">
                    <label for="billPrice" id="billPriceLabel">Installment price</label>
                    <input type="number" id="billPrice" placeholder="0.00" step="0.01" min="0" value="0.00">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="closeBillModalBtn"><span id="cancelLabelBill">Cancel</span></button>
                    <button type="submit" class="btn-success" id="billSubmitBtn"><i class="fas fa-check"></i> <span id="saveLabelBill">Save</span></button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer-note">
        <i class="fas fa-database"></i> <span id="footerText">permanent storage · all changes saved automatically</span>
    </div>
</div>
<script>

            },
            es: {

                newCard: 'Nueva tarjeta',

                export: 'Exportar',
                import: 'Importar',
                clearAll: 'Limpiar todo',
                emptyMsg: 'No hay tarjetas aún.<br>Crea tu primera tarjeta para empezar a añadir facturas.',
                footer: 'almacenamiento permanente · todos los cambios se guardan automáticamente',
                cardNameLabel: 'Nombre de la tarjeta',

                cardImageLabel: 'Imagen de la tarjeta',
                billNameLabel: 'Nombre de la factura',
                billDescLabel: 'Descripción',

                billInstallmentsLabel: 'Número de cuotas',
                billPriceLabel: 'Precio de la cuota',
                cancel: 'Cancelar',
                save: 'Guardar',
                editCard: 'Editar tarjeta',
                editBill: 'Editar factura',
                update: 'Actualizar',
                create: 'Crear',
                paid: 'pagado',
                installment: 'Cuota',
                pastDue: 'Vencido',
                dueSoon: 'Próximo a vencer',
                deleteCardConfirm: '¿Eliminar esta tarjeta y todas sus facturas?',
                deleteBillConfirm: '¿Eliminar esta factura?',
                clearAllConfirm: '¿Eliminar TODAS las tarjetas y facturas? ¡Esta acción no se puede deshacer!',
                exportError: 'No hay datos para exportar.',
                importSuccess: '¡Datos importados correctamente!',
                importError: 'Formato de archivo inválido. Importa un archivo JSON válido.',
                dateLocale: 'es-ES',
                noBills: 'No hay facturas aún. ¡Añade una!',
                back: 'Volver a tarjetas',
                totalPrice: 'Total',
                paidAmount: 'Pagado',
                remaining: 'Restante',
                installmentsPaidLabel: 'cuotas pagadas',
                installmentsLeftLabel: 'cuotas restantes',
                of: 'de',
                searchCards: 'Buscar tarjetas...',
                sortAlpha: 'Ordenar: A-Z',
                sortAlphaDesc: 'Ordenar: Z-A',
                noResults: 'No se encontraron tarjetas.'
            }
        };

        let currentLang = 'en';
        let cardImageDataUrl = null;
        let editingCardId = null;
        let editingBillId = null;
        let editingBillCardId = null;
        let selectedCardId = null;
        let isDetailMode = false;

        function t(key) {
            return translations[currentLang]?.[key] || key;
        }

        function getDateLocale() {
            return translations[currentLang]?.dateLocale || 'en-US';
        }

        function formatDate(date) {
            const locale = getDateLocale();
            return date.toLocaleDateString(locale, { month: '2-digit', day: '2-digit', year: 'numeric' });
        }

        function updateUI() {
            const elements = {
                'appTitle': 'appTitle',
                'newCardLabel': 'newCard',
                'exportLabel': 'export',
                'importLabel': 'import',
                'clearLabel': 'clearAll',
                'emptyMsg': 'emptyMsg',
                'footerText': 'footer',
                'cardNameLabel': 'cardNameLabel',
                'cardDescLabel': 'cardDescLabel',
                'cardImageLabel': 'cardImageLabel',
                'billNameLabel': 'billNameLabel',
                'billDescLabel': 'billDescLabel',
                'billDateLabel': 'billDateLabel',
                'billInstallmentsLabel': 'billInstallmentsLabel',
                'billPriceLabel': 'billPriceLabel',
                'cancelLabel': 'cancel',
                'saveLabel': 'save',
                'cancelLabelBill': 'cancel',
                'saveLabelBill': 'save'
            };
            
            for (const [id, key] of Object.entries(elements)) {
                const el = document.getElementById(id);
                if (el) {
                    el.textContent = t(key);
                }
            }

            // Update search placeholder
            const searchInput = document.getElementById('searchCardsInput');
            if (searchInput) searchInput.placeholder = t('searchCards');

            // Update sort dropdown
            const sortSelect = document.getElementById('sortCardsSelect');
            if (sortSelect) {
                sortSelect.options[0].text = t('sortAlpha');
                sortSelect.options[1].text = t('sortAlphaDesc');
            }

            // Update back button
            const backBtn = document.querySelector('.card-detail-back span');
            if (backBtn) backBtn.textContent = t('back');

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentLang = this.dataset.lang;
                updateUI();
                render();
            });
        });

        // ----- data management -----
        let cards = [];
        const STORAGE_KEY = 'cards_bills_data_v2';

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    cards = JSON.parse(stored);
                    cards = cards.filter(c => c && typeof c === 'object')
                                 .map(c => {
                                     if (!Array.isArray(c.bills)) c.bills = [];
                                     c.bills = c.bills.filter(b => b && typeof b === 'object')
                                        .map(b => {
                                            if (!Array.isArray(b.done)) b.done = [];
                                            while (b.done.length < b.installments) b.done.push(false);
                                            while (b.done.length > b.installments) b.done.pop();
                                            return b;
                                        });
                                     return c;
                                 });
                } catch(e) { cards = []; }
            } else {
                const today = new Date().toISOString().split('T')[0];
                cards = [
                    { 
                        id: 'c1', 
                        name: 'Main Credit Card', 
                        description: 'Primary card for all purchases',
                        image: null,
                        bills: [
                            { id: 'b1', name: 'MacBook Air', description: 'M3 chip, 16GB RAM', purchaseDate: today, installments: 3, price: 99.99, done: [true, false, false] },
                            { id: 'b2', name: 'Samsung S24', description: 'Ultra, 256GB', purchaseDate: today, installments: 5, price: 49.99, done: [false, false, false, false, false] }
                        ]
                    },
                    { 
                        id: 'c2', 
                        name: 'Store Card', 
                        description: 'Electronics store credit',
                        image: null,
                        bills: [
                            { id: 'b3', name: 'Sony Headphones', description: 'WH-1000XM5', purchaseDate: today, installments: 2, price: 29.99, done: [true, true] }
                        ]
                    },
                    { 
                        id: 'c3', 
                        name: 'Gas Card', 
                        description: 'Fuel purchases',
                        image: null,
                        bills: []
                    }
                ];
                saveData();
            }
            render();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
        }

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

        // ----- Card CRUD -----
        function addCard(card) {
            cards.push(card);
            saveData();
            render();
        }

        function updateCard(id, updated) {
            const index = cards.findIndex(c => c.id === id);
            if (index !== -1) {
                cards[index] = { ...cards[index], ...updated };
                saveData();
                render();
            }
        }

        function deleteCard(id) {
            if (confirm(t('deleteCardConfirm'))) {
                cards = cards.filter(c => c.id !== id);
                if (selectedCardId === id) {
                    selectedCardId = null;
                    isDetailMode = false;
                }
                saveData();
                render();
            }
        }

        // ----- Bill CRUD -----
        function addBill(cardId, bill) {
            const card = cards.find(c => c.id === cardId);
            if (card) {
                card.bills.push(bill);
                saveData();
                render();
            }
        }

        function updateBill(cardId, billId, updated) {
            const card = cards.find(c => c.id === cardId);
            if (card) {
                const index = card.bills.findIndex(b => b.id === billId);
                if (index !== -1) {
                    card.bills[index] = { ...card.bills[index], ...updated };
                    saveData();
                    render();
                }
            }
        }

        function deleteBill(cardId, billId) {
            if (confirm(t('deleteBillConfirm'))) {
                const card = cards.find(c => c.id === cardId);
                if (card) {
                    card.bills = card.bills.filter(b => b.id !== billId);
                    saveData();
                    render();
                }
            }
        }

        function toggleBillInstallment(cardId, billId, index) {
            const card = cards.find(c => c.id === cardId);
            if (card) {
                const bill = card.bills.find(b => b.id === billId);
                if (bill && index >= 0 && index < bill.done.length) {
                    bill.done[index] = !bill.done[index];
                    saveData();
                    render();
                }
            }
        }

        // ----- Compute installment dates -----
        function computeInstallmentDates(purchaseDate, installments) {
            const start = new Date(purchaseDate);
            const dates = [];
            for (let i = 0; i < installments; i++) {
                const d = new Date(start);
                d.setDate(d.getDate() + (i + 1) * 30);
                dates.push(d);
            }
            return dates;
        }

        // ----- Calculate bill payment summary -----
        function getBillSummary(bill) {
            const totalPrice = (bill.price || 0) * bill.installments;
            const paidCount = bill.done.filter(Boolean).length;
            const paidAmount = paidCount * (bill.price || 0);
            const remainingAmount = totalPrice - paidAmount;
            return { totalPrice, paidCount, paidAmount, remainingAmount };
        }

        // ----- Export / Import -----
        function exportData() {
            if (cards.length === 0) {
                alert(t('exportError'));
                return;
            }
            const data = {
                version: '2.0',
                exportedAt: new Date().toISOString(),
                cards: cards
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cards_bills_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.cards || !Array.isArray(data.cards)) {
                        alert(t('importError'));
                        return;
                    }
                    const importedCards = data.cards.filter(c => c && typeof c === 'object' && c.name);
                    if (importedCards.length === 0) {
                        alert(t('importError'));
                        return;
                    }
                    const sanitized = importedCards.map(c => ({
                        id: c.id || generateId(),
                        name: c.name,
                        description: c.description || '',
                        image: c.image || null,
                        bills: Array.isArray(c.bills) ? c.bills.map(b => ({
                            id: b.id || generateId(),
                            name: b.name || 'Unnamed bill',
                            description: b.description || '',
                            purchaseDate: b.purchaseDate || new Date().toISOString().split('T')[0],
                            installments: parseInt(b.installments, 10) || 3,
                            price: parseFloat(b.price) || 0,
                            done: Array.isArray(b.done) ? b.done : new Array(parseInt(b.installments, 10) || 3).fill(false)
                        })) : []
                    }));
                    sanitized.forEach(c => {
                        c.bills.forEach(b => {
                            while (b.done.length < b.installments) b.done.push(false);
                            while (b.done.length > b.installments) b.done.pop();
                        });
                    });
                    
                    cards = sanitized;
                    selectedCardId = null;
                    isDetailMode = false;
                    saveData();
                    alert(t('importSuccess'));
                    render();
                } catch(err) {
                    alert(t('importError'));
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (confirm(t('clearAllConfirm'))) {
                cards = [];
                selectedCardId = null;
                isDetailMode = false;
                saveData();
                render();
            }
        }

        // ----- Render Bill -----
        function renderBill(bill, cardId) {
            const { id, name, description, purchaseDate, installments, price, done } = bill;
            const dates = computeInstallmentDates(purchaseDate, installments);
            const today = new Date();
            const formatter = new Intl.NumberFormat(getDateLocale(), { style: 'currency', currency: 'USD' });
            const summary = getBillSummary(bill);
            const remainingClass = summary.remainingAmount <= 0 ? 'zero' : '';

            const div = document.createElement('div');
            div.className = 'bill-card';

            const header = document.createElement('div');
            header.className = 'bill-header';
            header.innerHTML = `
                <div>
                    <div class="bill-title">${name} <small>${installments}x</small></div>
                    ${description ? `<div class="bill-desc">${description}</div>` : ''}
                </div>
                <div class="bill-actions">
                    <button class="icon-btn-sm edit-bill-btn" data-card="${cardId}" data-bill="${id}" title="Edit"><i class="fas fa-edit"></i></button>
                    <button class="icon-btn-sm danger delete-bill-btn" data-card="${cardId}" data-bill="${id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                </div>
            `;
            div.appendChild(header);

            const info = document.createElement('div');
            info.className = 'bill-info';
            info.innerHTML = `
                <span><i class="fas fa-calendar-check"></i> ${summary.paidCount}/${installments} ${t('paid')}</span>
                <span><i class="fas fa-dollar-sign"></i> ${formatter.format(summary.totalPrice)}</span>
            `;
            div.appendChild(info);

            // Payment summary row
            const paymentSummary = document.createElement('div');
            paymentSummary.style.cssText = `
                display: flex;
                justify-content: space-between;
                font-size: 0.8rem;
                padding: 0.2rem 0.4rem;
                margin-bottom: 0.6rem;
                background: #f0f5fa;
                border-radius: 30px;
                padding: 0.3rem 0.8rem;
                font-weight: 500;
            `;
            const installmentsLeftCount = installments - summary.paidCount;
            paymentSummary.innerHTML = `
                <span style="color: #1a7a5c; display: flex; flex-direction: column;">
                    <span><i class="fas fa-check-circle"></i> ${t('paidAmount')}: ${formatter.format(summary.paidAmount)}</span>
                    <small style="font-weight: 400; opacity: 0.85;">${summary.paidCount} ${t('of')} ${installments} ${t('installmentsPaidLabel')}</small>
                </span>
                <span style="color: ${summary.remainingAmount <= 0 ? '#1a7a5c' : '#b34a3a'}; display: flex; flex-direction: column; text-align: right;">
                    <span><i class="fas fa-clock"></i> ${t('remaining')}: ${formatter.format(summary.remainingAmount)}</span>
                    <small style="font-weight: 400; opacity: 0.85;">${installmentsLeftCount} ${t('of')} ${installments} ${t('installmentsLeftLabel')}</small>
                </span>
            `;
            div.appendChild(paymentSummary);

            const timeline = document.createElement('div');
            timeline.className = 'bill-timeline';

            for (let i = 0; i < installments; i++) {
                const isDone = done[i] || false;
                const dueDate = dates[i] || new Date();
                const isPastDue = !isDone && dueDate < today;
                const isDueSoon = !isDone && !isPastDue && dueDate < new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
                const dateStr = formatDate(dueDate);

                const item = document.createElement('div');
                item.className = `bill-installment ${isDone ? 'done' : ''} ${isPastDue ? 'past-due' : ''}`;

                const check = document.createElement('input');
                check.type = 'checkbox';
                check.checked = isDone;
                check.dataset.card = cardId;
                check.dataset.bill = id;
                check.dataset.index = i;
                check.addEventListener('change', function(e) {
                    e.stopPropagation();
                    toggleBillInstallment(this.dataset.card, this.dataset.bill, parseInt(this.dataset.index, 10));
                });

                const label = document.createElement('span');
                label.className = 'installment-label';
                label.innerHTML = `<i class="fas fa-circle"></i> ${t('installment')} ${i+1}`;

                let statusBadge = '';
                if (!isDone && isPastDue) {
                    statusBadge = `<span class="badge-pastdue-sm">${t('pastDue')}</span>`;
                } else if (!isDone && isDueSoon) {
                    statusBadge = `<span class="badge-due-sm">${t('dueSoon')}</span>`;
                }

                const dateSpan = document.createElement('span');
                dateSpan.className = 'installment-date';
                dateSpan.innerHTML = `${dateStr} ${statusBadge}`;

                item.appendChild(check);
                item.appendChild(label);
                item.appendChild(dateSpan);

                if (price) {
                    const priceSpan = document.createElement('span');
                    priceSpan.className = 'installment-price-sm';
                    priceSpan.textContent = formatter.format(price);
                    item.appendChild(priceSpan);
                }

                timeline.appendChild(item);
            }

            div.appendChild(timeline);
            return div;
        }

        // ----- Render Dashboard -----
        function renderDashboard() {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';

            if (cards.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('cardDetail').classList.remove('visible');
                dashboard.classList.add('hidden');
                document.getElementById('dashboardControls').style.display = 'none';
                return;
            }
            document.getElementById('emptyState').style.display = 'none';
            dashboard.classList.remove('hidden');
            document.getElementById('dashboardControls').style.display = 'flex';

            // Get search and sort values
            const searchTerm = document.getElementById('searchCardsInput').value.toLowerCase().trim();
            const sortType = document.getElementById('sortCardsSelect').value;

            // Filter cards
            let filteredCards = cards.filter(card => 
                card.name.toLowerCase().includes(searchTerm) ||
                (card.description && card.description.toLowerCase().includes(searchTerm))
            );

            // Sort cards
            if (sortType === 'alpha') {
                filteredCards.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortType === 'alphaDesc') {
                filteredCards.sort((a, b) => b.name.localeCompare(a.name));
            }

            // Update stats
            document.getElementById('cardsStats').textContent = `${filteredCards.length} cards`;

            if (filteredCards.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.innerHTML = `
                    <i class="fas fa-search"></i>
                    <p>${t('noResults')}</p>
                `;
                dashboard.appendChild(noResults);
                return;
            }

            filteredCards.forEach(card => {
                const div = document.createElement('div');
                div.className = `card-item ${selectedCardId === card.id && isDetailMode ? 'active' : ''}`;
                div.dataset.cardId = card.id;

                const totalBills = card.bills.length;
                let totalPaid = 0;
                let totalInstallments = 0;
                let totalRemaining = 0;
                card.bills.forEach(b => {
                    const summary = getBillSummary(b);
                    totalPaid += summary.paidCount;
                    totalInstallments += b.installments;
                    totalRemaining += summary.remainingAmount;
                });

                const formatter = new Intl.NumberFormat(getDateLocale(), { style: 'currency', currency: 'USD' });

                div.innerHTML = `
                    <div class="card-item-image">
                        ${card.image ? `<img src="${card.image}" alt="${card.name}">` : `<i class="fas fa-credit-card"></i>`}
                    </div>
                    <div class="card-item-name">${card.name}</div>
                    ${card.description ? `<div class="card-item-desc">${card.description}</div>` : ''}
                    <div class="card-item-badge">
                        <i class="fas fa-receipt"></i> ${totalBills} bills · ${totalPaid} ${t('of')} ${totalInstallments} ${t('installmentsPaidLabel')}
                        ${totalInstallments - totalPaid > 0 ? `· ${totalInstallments - totalPaid} ${t('of')} ${totalInstallments} ${t('installmentsLeftLabel')} (${formatter.format(totalRemaining)})` : ' ✅ Paid off!'}
                    </div>
                    <div class="card-item-actions">
                        <button class="edit-card-btn" data-card="${card.id}" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="danger delete-card-btn" data-card="${card.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;

                div.addEventListener('click', function(e) {
                    if (e.target.closest('.card-item-actions')) return;
                    const cardId = this.dataset.cardId;
                    selectedCardId = cardId;
                    isDetailMode = true;
                    render();
                });

                dashboard.appendChild(div);
            });

            document.querySelectorAll('.edit-card-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cardId = this.dataset.card;
                    openCardModal(cardId);
                });
            });

            document.querySelectorAll('.delete-card-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cardId = this.dataset.card;
                    deleteCard(cardId);
                });
            });
        }

        // ----- Render Card Detail (FULL PAGE) -----
        function renderCardDetail() {
            const detail = document.getElementById('cardDetail');
            const container = document.getElementById('appContainer');
            
            if (!selectedCardId || !isDetailMode) {
                detail.classList.remove('visible');
                container.classList.remove('detail-mode');
                return;
            }

            const card = cards.find(c => c.id === selectedCardId);
            if (!card) {
                detail.classList.remove('visible');
                container.classList.remove('detail-mode');
                selectedCardId = null;
                isDetailMode = false;
                return;
            }

            // Enter detail mode - hides dashboard
            container.classList.add('detail-mode');
            detail.classList.add('visible');

            // Calculate totals for the card
            let totalBills = card.bills.length;
            let totalPrice = 0;
            let totalPaid = 0;
            let totalRemaining = 0;
            card.bills.forEach(b => {
                const summary = getBillSummary(b);
                totalPrice += summary.totalPrice;
                totalPaid += summary.paidAmount;
                totalRemaining += summary.remainingAmount;
            });
            const formatter = new Intl.NumberFormat(getDateLocale(), { style: 'currency', currency: 'USD' });

            // Back button
            const backBtn = document.createElement('button');
            backBtn.className = 'card-detail-back';
            backBtn.innerHTML = `<i class="fas fa-arrow-left"></i> <span>${t('back')}</span>`;
            backBtn.addEventListener('click', function() {
                selectedCardId = null;
                isDetailMode = false;
                render();
            });

            const header = document.createElement('div');
            header.className = 'card-detail-header';
            header.innerHTML = `
                <div class="card-detail-title">
                    <div class="card-detail-image">
                        ${card.image ? `<img src="${card.image}" alt="${card.name}">` : `<i class="fas fa-credit-card"></i>`}
                    </div>
                    <div class="card-detail-info">
                        <h2>${card.name}</h2>
                        ${card.description ? `<div class="desc">${card.description}</div>` : ''}
                        <div class="summary">
                            ${totalBills} bills · Total: ${formatter.format(totalPrice)} · 
                            <span style="color:#1a7a5c;">Paid: ${formatter.format(totalPaid)}</span> · 
                            <span style="color:${totalRemaining <= 0 ? '#1a7a5c' : '#b34a3a'};">Remaining: ${formatter.format(totalRemaining)}</span>
                        </div>
                    </div>
                </div>
                <div class="card-detail-actions">
                    <button class="btn-sm btn-sm-success add-bill-btn" data-card="${card.id}"><i class="fas fa-plus"></i> <span>Add bill</span></button>
                    <button class="btn-sm btn-sm-outline edit-card-btn" data-card="${card.id}"><i class="fas fa-edit"></i> Edit</button>
                    <button class="btn-sm btn-sm-danger delete-card-btn" data-card="${card.id}"><i class="fas fa-trash-alt"></i> Delete</button>
                </div>
            `;

            const billGrid = document.createElement('div');
            billGrid.className = 'bill-grid';

            if (card.bills && card.bills.length > 0) {
                card.bills.forEach(bill => {
                    const billEl = renderBill(bill, card.id);
                    billGrid.appendChild(billEl);
                });
            } else {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-bills';
                emptyDiv.innerHTML = `
                    <i class="fas fa-receipt"></i>
                    <p>${t('noBills')}</p>
                    <button class="btn-sm btn-sm-success add-bill-btn" data-card="${card.id}">
                        <i class="fas fa-plus"></i> ${t('newBill')}
                    </button>
                `;
                billGrid.appendChild(emptyDiv);
            }

            detail.innerHTML = '';
            detail.appendChild(backBtn);
            detail.appendChild(header);
            detail.appendChild(billGrid);

            document.querySelectorAll('.add-bill-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cardId = this.dataset.card;
                    openBillModal(cardId);
                });
            });

            document.querySelectorAll('.edit-card-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cardId = this.dataset.card;
                    openCardModal(cardId);
                });
            });

            document.querySelectorAll('.delete-card-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cardId = this.dataset.card;
                    deleteCard(cardId);
                });
            });

            document.querySelectorAll('.edit-bill-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cardId = this.dataset.card;
                    const billId = this.dataset.bill;
                    openBillModal(cardId, billId);
                });
            });

            document.querySelectorAll('.delete-bill-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cardId = this.dataset.card;
                    const billId = this.dataset.bill;
                    deleteBill(cardId, billId);
                });
            });

            updateUI();
        }

        // ----- Main Render -----
        function render() {
            renderDashboard();
            renderCardDetail();
            updateUI();
        }

        // ----- Modal: Card -----
        const cardModal = document.getElementById('cardModal');
        const cardForm = document.getElementById('cardForm');
        const cardNameInput = document.getElementById('cardNameInput');
        const cardDescInput = document.getElementById('cardDescInput');
        const cardImageInput = document.getElementById('cardImageInput');
        const cardImagePreview = document.getElementById('cardImagePreview');
        const cardSubmitBtn = document.getElementById('cardSubmitBtn');
        const closeCardModalBtn = document.getElementById('closeCardModalBtn');
        const cardModalTitle = document.getElementById('cardModalTitle');

        cardImageInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    cardImagePreview.innerHTML = `<img src="${ev.target.result}" alt="Preview">`;
                    cardImageDataUrl = ev.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                cardImagePreview.innerHTML = '<i class="fas fa-image"></i>';
                cardImageDataUrl = null;
            }
        });

        function openCardModal(cardId = null) {
            cardModal.classList.add('active');
            cardImageDataUrl = null;
            cardImagePreview.innerHTML = '<i class="fas fa-image"></i>';
            cardImageInput.value = '';
            // Focus first input after modal opens
            setTimeout(() => cardNameInput.focus(), 150);

            if (cardId) {
                const card = cards.find(c => c.id === cardId);
                if (!card) return;
                cardModalTitle.innerHTML = `<i class="fas fa-edit"></i> ${t('editCard')}`;
                cardNameInput.value = card.name || '';
                cardDescInput.value = card.description || '';
                if (card.image) {
                    cardImagePreview.innerHTML = `<img src="${card.image}" alt="Preview">`;
                    cardImageDataUrl = card.image;
                }
                cardSubmitBtn.innerHTML = `<i class="fas fa-check"></i> ${t('update')}`;
                editingCardId = cardId;
            } else {
                cardModalTitle.innerHTML = `<i class="fas fa-plus-circle"></i> ${t('newCard')}`;
                cardNameInput.value = '';
                cardDescInput.value = '';
                cardSubmitBtn.innerHTML = `<i class="fas fa-check"></i> ${t('create')}`;
                editingCardId = null;
            }
        }

        function closeCardModal() {
            cardModal.classList.remove('active');
            editingCardId = null;
            cardImageDataUrl = null;
            cardImagePreview.innerHTML = '<i class="fas fa-image"></i>';
        }

        closeCardModalBtn.addEventListener('click', closeCardModal);
        cardModal.addEventListener('click', function(e) {
            if (e.target === cardModal) closeCardModal();
        });

        // ESC key for card modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (cardModal.classList.contains('active')) {
                    closeCardModal();
                }
                if (billModal.classList.contains('active')) {
                    closeBillModal();
                }
            }
        });

        // Enter key for card form
        cardForm.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                cardForm.dispatchEvent(new Event('submit'));
            }
        });

        cardForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = cardNameInput.value.trim();
            if (!name) { alert('Please enter a card name.'); return; }
            const description = cardDescInput.value.trim();

            let finalImage = cardImageDataUrl;
            if (!finalImage && editingCardId) {
                const existing = cards.find(c => c.id === editingCardId);
                if (existing) finalImage = existing.image;
            }

            if (editingCardId) {
                updateCard(editingCardId, { name, description, image: finalImage });
            } else {
                const newCard = {
                    id: generateId(),
                    name,
                    description,
                    image: finalImage,
                    bills: []
                };
                addCard(newCard);
            }
            closeCardModal();
            cardForm.reset();
            render();
        });

        // ----- Modal: Bill -----
        const billModal = document.getElementById('billModal');
        const billForm = document.getElementById('billForm');
        const billNameInput = document.getElementById('billNameInput');
        const billDescInput = document.getElementById('billDescInput');
        const billPurchaseDate = document.getElementById('billPurchaseDate');
        const billInstallments = document.getElementById('billInstallments');
        const billPrice = document.getElementById('billPrice');
        const billSubmitBtn = document.getElementById('billSubmitBtn');
        const closeBillModalBtn = document.getElementById('closeBillModalBtn');
        const billModalTitle = document.getElementById('billModalTitle');

        function openBillModal(cardId, billId = null) {
            billModal.classList.add('active');
            billForm.reset();
            // Focus first input after modal opens
            setTimeout(() => billNameInput.focus(), 150);

            if (billId) {
                const card = cards.find(c => c.id === cardId);
                if (!card) return;
                const bill = card.bills.find(b => b.id === billId);
                if (!bill) return;
                billModalTitle.innerHTML = `<i class="fas fa-edit"></i> ${t('editBill')}`;
                billNameInput.value = bill.name || '';
                billDescInput.value = bill.description || '';
                billPurchaseDate.value = bill.purchaseDate || '';
                billInstallments.value = bill.installments || 3;
                billPrice.value = bill.price ? bill.price.toFixed(2) : '0.00';
                billSubmitBtn.innerHTML = `<i class="fas fa-check"></i> ${t('update')}`;
                editingBillId = billId;
                editingBillCardId = cardId;
            } else {
                billModalTitle.innerHTML = `<i class="fas fa-receipt"></i> ${t('newBill')}`;
                const today = new Date().toISOString().split('T')[0];
                billPurchaseDate.value = today;
                billInstallments.value = '3';
                billPrice.value = '0.00';
                billSubmitBtn.innerHTML = `<i class="fas fa-check"></i> ${t('create')}`;
                editingBillId = null;
                editingBillCardId = cardId;
            }
        }

        function closeBillModal() {
            billModal.classList.remove('active');
            editingBillId = null;
            editingBillCardId = null;
        }

        closeBillModalBtn.addEventListener('click', closeBillModal);
        billModal.addEventListener('click', function(e) {
            if (e.target === billModal) closeBillModal();
        });

        // Enter key for bill form
        billForm.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                billForm.dispatchEvent(new Event('submit'));
            }
        });

        billForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = billNameInput.value.trim();
            if (!name) { alert('Please enter a bill name.'); return; }
            const description = billDescInput.value.trim();
            const purchaseDate = billPurchaseDate.value;
            if (!purchaseDate) { alert('Please select a purchase date.'); return; }
            const installments = parseInt(billInstallments.value, 10);
            if (installments < 1) { alert('Installments must be at least 1.'); return; }
            const price = parseFloat(billPrice.value) || 0;

            if (editingBillId && editingBillCardId) {
                updateBill(editingBillCardId, editingBillId, {
                    name, description, purchaseDate, installments, price
                });
            } else if (editingBillCardId) {
                const newBill = {
                    id: generateId(),
                    name,
                    description,
                    purchaseDate,
                    installments,
                    price,
                    done: new Array(installments).fill(false)
                };
                addBill(editingBillCardId, newBill);
            }
            closeBillModal();
            billForm.reset();
            render();
        });

        // ----- Search & Sort events -----
        document.getElementById('searchCardsInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!isDetailMode) render();
            }
        });

        document.getElementById('searchCardsInput').addEventListener('input', function(e) {
            if (!isDetailMode) render();
        });

        document.getElementById('sortCardsSelect').addEventListener('change', function(e) {
            if (!isDetailMode) render();
        });

        // ----- Events -----
        document.getElementById('openCreateCardBtn').addEventListener('click', function() {
            openCardModal(null);
        });

        document.getElementById('emptyCreateBtn').addEventListener('click', function() {
            openCardModal(null);
        });

        document.getElementById('exportBtn').addEventListener('click', exportData);
        document.getElementById('importBtn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                importData(this.files[0]);
                this.value = '';
            }
        });
        document.getElementById('clearAllBtn').addEventListener('click', clearAllData);

        // ----- Init -----
        loadData();
        updateUI();

        window.__cards = cards;
    })();
</script>
</body>
</html>
